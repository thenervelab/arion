[package]
name = "miner"
version = "0.1.34"
edition = "2024"

[dependencies]
common = { path = "../common" }
pos-circuits = { path = "../pos-circuits" }
iroh = { workspace = true }
iroh-base = { workspace = true }
iroh-blobs = { workspace = true }
iroh-docs = { workspace = true }
iroh-gossip = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
crc32fast = "1"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
fs2 = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
quick_cache = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { workspace = true }
semver = { workspace = true }
quinn = "0.11"
rusqlite = { version = "0.31", features = ["bundled"] }
ed25519-dalek = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
memmap2 = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }

[features]
# 0.1.34 ships both code paths (0.1.33 was the read-and-observe release
# without them). Compiled in does NOT mean active: the runtime switches
# stay off (`PURGE_ENABLED=false`, `PURGE_DRY_RUN=true` once enabled,
# `BACKFILL_ENABLED=false`); see README "Operator guide". A census-only
# binary is still one `cargo build -p miner --no-default-features` away.
default = ["purge-enforce", "backfill"]
# Compiles the deleting arm of the obligation-list purge (`purge::Mode::Enforce`,
# the trash/unlink calls of `pg_purge::run_pass`). Without it a build counts
# and never deletes, whatever PURGE_DRY_RUN says.
purge-enforce = []
# Compiles and spawns the obligation-list backfill loop (`pg_backfill`), a
# background path that writes blobs fetched from peer miners. Without it
# the binary carries no such path. The module is still built under
# `cfg(test)` so its tests run without the feature.
backfill = []

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "generate_keypair"
path = "src/bin/generate_keypair.rs"
